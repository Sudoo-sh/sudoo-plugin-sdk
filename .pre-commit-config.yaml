# Checks run on every commit. Install once: uvx pre-commit install
default_install_hook_types: [pre-commit]
# Licences, tool folders, fixtures, generated files and lock files stay as they are.
exclude: |
  (?x)^(
    LICENSE\.md|
    \.claude/.*|
    .*fixture.*\.json|
    tests/fixtures/.*|
    uv\.lock
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (type hints)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
